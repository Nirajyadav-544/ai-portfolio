
spring:
  datasource:
    url: jdbc:h2:mem:portfolio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none

app:
  jwt:
    secret: test-secret-test-secret-test-secret-1234
  cookie:
    secure: false
  security:
    bcrypt-strength: 4
  bootstrap:
    admin-email: ""
    admin-password: ""
  ai:
    api-key: ""
